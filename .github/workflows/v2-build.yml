name: Triply V2 Android CI

on:
  push:
    branches: [ "v2" ]
    paths:
      - "triply-v2-android-source.zip"
      - ".github/workflows/v2-build.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: test -s triply-v2-android-source.zip

      - name: Extract Triply V2 source
        run: |
          mkdir -p v2-source
          unzip -q triply-v2-android-source.zip -d v2-source
          test -f v2-source/triply-v2/settings.gradle.kts

      - name: Apply verified Kotlin syntax fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("v2-source/triply-v2/app/src/main/java/com/triply/app")
          remote = root / "data/remote/RemoteProviders.kt"
          lines = remote.read_text().splitlines()
          for key in ("node", "way"):
              i = next(i for i, line in enumerate(lines) if line.lstrip().startswith(f'"{key}['))
              lines[i] = f'                "{key}[\\"$tagKey\\"=\\"$tagVal\\"](around:$radiusMeters,$centerLat,$centerLon);" +'
          remote.write_text("\n".join(lines) + "\n")
          detail = root / "ui/screens/TripDetailScreen.kt"
          lines = detail.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if '"Trip: ${preview.payload.trip.title}' in line)
          end = next(i for i in range(start, len(lines)) if "if (preview.hasTripIdConflict)" in lines[i])
          lines[start:end + 1] = [
              '                    "Trip: ${preview.payload.trip.title}\\n" +',
              '                        "Destinations: ${preview.payload.destinations.size}\\n" +',
              '                        "Expenses: ${preview.payload.expenses.size}\\n" +',
              '                        "Photos: ${preview.photoEntryCount}\\n" +',
              '                        if (preview.hasTripIdConflict) "Note: Existing trip ID detected; will import as a safe copy." else ""'
          ]
          detail.write_text("\n".join(lines) + "\n")
          map_screen = root / "ui/screens/MapDiscoveryScreen.kt"
          text = map_screen.read_text()
          text = text.replace("centerLat = center?.latitude ?: defaultLat,", "lat = center?.latitude ?: defaultLat,")
          text = text.replace("centerLon = center?.longitude ?: defaultLon", "lon = center?.longitude ?: defaultLon")
          map_screen.write_text(text)
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run JVM unit tests
        working-directory: v2-source/triply-v2
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: v2-source/triply-v2
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: triply-v2-debug-apk
          path: v2-source/triply-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triply-v2-unit-test-report
          path: v2-source/triply-v2/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
