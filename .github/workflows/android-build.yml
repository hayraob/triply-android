name: Build Triply Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q triply-android-v1.zip -d extracted
          test -d extracted/triply
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/triply" >> "$GITHUB_ENV"

      - name: Inspect Kotlin compile error context
        working-directory: extracted/triply
        run: |
          echo "===== TripPreparationTab.kt lines 465-510 ====="
          sed -n '465,510p' app/src/main/java/com/triply/app/feature/preparation/TripPreparationTab.kt
          echo "===== Matching freshness declarations and values ====="
          grep -R -n -E 'enum class|sealed (class|interface)|FRESH|STALE|OFFLINE_CACHED|freshness|Freshness' app/src/main/java/com/triply/app | head -240

      - name: Run unit tests
        working-directory: extracted/triply
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: extracted/triply
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: triply-debug-apk
          path: extracted/triply/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
